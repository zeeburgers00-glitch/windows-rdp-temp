name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Setup RDP + Tunnel
        shell: pwsh
        run: |
          # ---- Password set ----
          $password = ConvertTo-SecureString "Rdp@12345" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password

          # ---- RDP enable ----
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Start-Service TermService

          # ---- bore.pub tunnel (free, no account) ----
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath . -Force

          $job = Start-Process -FilePath ".\bore.exe" -ArgumentList "local","3389","--to","bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore.err" -PassThru -NoNewWindow

          Start-Sleep 25
          $tunnel = ""
          if (Test-Path "bore.log") { $tunnel = (Get-Content bore.log -Raw) }
          $errText = ""
          if (Test-Path "bore.err") { $errText = (Get-Content bore.err -Raw) }
          Write-Host "BORE OUTPUT: $tunnel"
          Write-Host "BORE ERR: $errText"

          # extract host:port
          if ($tunnel -match 'listening at ([a-z0-9\.\-]+:\d+)') {
            $addr = $Matches[1]
          } else {
            $addr = $tunnel.Trim()
          }

          @"
          ### RDP Connection Details
          - **Address:** ``$addr``
          - **Username:** ``runneradmin``
          - **Password:** ``Rdp@12345``

          Open **mstsc** -> paste the address above.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          # also save to a file we can pull later
          $addr | Out-File -FilePath "rdp_addr.txt"

      - name: Upload address
        uses: actions/upload-artifact@v4
        with:
          name: rdp-address
          path: rdp_addr.txt

      - name: Keep session alive
        run: Start-Sleep -Seconds 330
